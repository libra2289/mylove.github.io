<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lee ♡ Libra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glow glow-pink" aria-hidden="true"></div>
    <div class="glow glow-violet" aria-hidden="true"></div>

    <main class="page">
      <section class="photos" aria-label="Фотографии">
        <figure class="photo-slot">
          <img src="photo1.jpg" alt="" loading="lazy" />
        </figure>
        <figure class="photo-slot">
          <img src="photo2.jpg" alt="" loading="lazy" />
        </figure>
        <figure class="photo-slot">
          <img src="photo3.jpg" alt="" loading="lazy" />
        </figure>
      </section>

      <header class="hero">
        <p class="eyebrow">наша история</p>
        <h1>Lee ♡ Libra</h1>
        <p class="subtitle">вместе с 3 июля 2025</p>

        <section class="timer-frame" aria-label="Сколько мы вместе">
          <div class="timer" id="timer">
            <div class="unit">
              <span class="value" data-unit="years">0</span>
              <span class="label" data-label="years">лет</span>
            </div>
            <div class="unit">
              <span class="value" data-unit="months">0</span>
              <span class="label" data-label="months">месяцев</span>
            </div>
            <div class="unit">
              <span class="value" data-unit="days">0</span>
              <span class="label" data-label="days">дней</span>
            </div>
            <div class="unit">
              <span class="value" data-unit="hours">0</span>
              <span class="label" data-label="hours">часов</span>
            </div>
            <div class="unit">
              <span class="value" data-unit="minutes">0</span>
              <span class="label" data-label="minutes">минут</span>
            </div>
            <div class="unit">
              <span class="value" data-unit="seconds">0</span>
              <span class="label" data-label="seconds">секунд</span>
            </div>
          </div>
        </section>
      </header>

      <section class="story" aria-labelledby="story-title">
        <h2 id="story-title">Лента воспоминаний</h2>
        <ol class="timeline" id="timeline"></ol>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
